# SDK Add-on Manifest

name=ShiftOS SDK v16
name-id=shiftos-sdk-v16-36
vendor=SHIFT
vendor-id=shift
description=SDK for SHIFT Android devices running ShiftOS 16.x

# version of the Android platform on which this add-on is built.
api=36

# revision of the add-on. This must be a strict integer.
revision=1

# list of libraries, separated by a semi-colon.
libraries=eco.shift.sdk;org.lineageos.platform

# details for each library
eco.shift.sdk=eco.shift.sdk.jar;SDK for interacting with ShiftOS
org.lineageos.platform=org.lineageos.platform.jar;SDK for interacting with LineageOS
